  // Published for the dashboard's compact Fitness summary card -- read-only
  // there, this (plus the logBtn handler below) is what keeps it current.
  // Re-walk vs equavia-pre-answers-final.md 4.5: Sunday 7 PM (was Monday
  // 6am -- see dashboard.html's own weekStartSunday7pm for the full note).
  function weekStartSunday7pm(refDate) {
    const shifted = new Date(refDate.getTime() - 19 * 3600000);
    const daysSinceSunday = shifted.getDay();
    const sundayShifted = new Date(shifted.getFullYear(), shifted.getMonth(), shifted.getDate() - daysSinceSunday);
    return new Date(sundayShifted.getTime() + 19 * 3600000);
  }

  // Weight fields (currentWeight/weight7dAvg/weight7dAvgChange/units) on
  // eq.fitness.summary are now owned by health.html's own weight section --
  // this only ever merges the training-progression fields below into
  // whatever health.html last wrote for weight, never overwrites them.
  function publishFitnessSummary() {
    try {
      let lastSessionAt = null, lastSessionDay = null;
      Object.keys(state.logs || {}).forEach((exId) => {
        (state.logs[exId] || []).forEach((l) => {
          if (!lastSessionAt || l.date > lastSessionAt) {
            lastSessionAt = l.date;
            const ex = state.exercises.find((e) => e.id === exId);
            lastSessionDay = ex ? ex.day : null;
          }
        });
      });

      // Weekly aggregates, feeds the Weekly Report widget (3.3) -- computed
      // here (not read raw from dashboard.html) since state.logs has already
      // been through normalize() by this point in the page's lifecycle.
      const weekStart = weekStartSunday7pm(new Date());
      const sessionDates = new Set();
      let volumeThisWeek = 0;
      Object.keys(state.logs || {}).forEach((exId) => {
        (state.logs[exId] || []).forEach((l) => {
          const logDate = new Date(l.date);
          if (logDate >= weekStart) {
            sessionDates.add(logDate.toDateString());
            volumeThisWeek += (l.weight || 0) * (l.reps || 0);
          }
        });
      });

      // Re-walk vs equavia-pre-answers-final.md 3.3: "lifting progression
      // status (progressed/plateaued/regressed per exercise vs previous
      // week)" -- didn't exist at all before (getRx() prescribes the next
      // session's numbers but never classifies past performance). Compares
      // each exercise's best set this week vs last week using the exact
      // same scoreForLog() the sparkline's own top-set filter already uses
      // (e1RM for weighted exercises, reps for bodyweight ones) -- one
      // shared definition of "best set," not a second one invented here.
      // Exercises with no logged set in one of the two weeks are skipped
      // entirely (no data to compare -- never inferred either way).
      const lastWeekStart = new Date(weekStart.getTime() - 7 * 86400000);
      const progressionThisWeek = [];
      state.exercises.forEach((ex) => {
        const logs = state.logs[ex.id] || [];
        let thisWeekTop = null, lastWeekTop = null;
        logs.forEach((l) => {
          const d = new Date(l.date);
          const score = scoreForLog(ex, l);
          if (d >= weekStart) { if (thisWeekTop == null || score > thisWeekTop) thisWeekTop = score; }
          else if (d >= lastWeekStart) { if (lastWeekTop == null || score > lastWeekTop) lastWeekTop = score; }
        });
        if (thisWeekTop == null || lastWeekTop == null) return;
        const status = thisWeekTop > lastWeekTop ? 'progressed' : thisWeekTop < lastWeekTop ? 'regressed' : 'plateaued';
        progressionThisWeek.push({ exercise: ex.name, status });
      });

      let existing = {};
      try { existing = JSON.parse(localStorage.getItem('eq.fitness.summary')) || {}; } catch (e) {}
      localStorage.setItem('eq.fitness.summary', JSON.stringify(Object.assign({}, existing, {
        lastSessionAt: lastSessionAt,
        lastSessionDay: lastSessionDay,
        sessionsThisWeek: sessionDates.size,
        volumeThisWeek: Math.round(volumeThisWeek),
        progressionThisWeek: progressionThisWeek,
        at: new Date().toISOString()
      })));
    } catch (e) {}
  }

  const PC_SYNCED_KEYS = ['po_coach_v1', 'po_coach_workout_done', 'po_coach_weights', 'po_coach_goal_weight', 'calorie_log_v1'];

  let pcSupa = null;

  const _pcOrigRemove = localStorage.removeItem.bind(localStorage);
  // Wrap setItem/removeItem so a sync-side error can NEVER prevent the
  // underlying write from happening. The original call always runs;
  // any error in the sync scheduling is swallowed.
  localStorage.setItem = function(k, v) {

      if (!pcSuppressSync && PC_SYNCED_KEYS.indexOf(k) !== -1) pcSchedulePush();
    } catch (e) {}

  localStorage.removeItem = function(k) {
    _pcOrigRemove(k);
    try {
      if (!pcSuppressSync && PC_SYNCED_KEYS.indexOf(k) !== -1) pcSchedulePush();
    } catch (e) {}
  };

  function pcCollectState() {
    const out = {};
    for (const k of PC_SYNCED_KEYS) {
      const v = localStorage.getItem(k);
      if (v == null) continue;
      try { out[k] = JSON.parse(v); } catch {}
    }
    return out;
  }

  function pcIsUserEditing() {
    const ae = document.activeElement;
    if (!ae) return false;
    const tag = ae.tagName;

    if (ae.getAttribute && ae.getAttribute('contenteditable') === 'true') return true;

  function pcApplyRemoteState(remote) {
    if (!remote || typeof remote !== 'object') return false;
    pcSuppressSync = true;
    let changed = false;
    try {
      for (const k of PC_SYNCED_KEYS) {

        } else if (localStorage.getItem(k) != null) {

      }
    } finally {
      pcSuppressSync = false;
    }
    if (changed) { try { pcRerender(); } catch (e) {} }
    return changed;
  }

  function pcMaybeApplyRemote(remote) {
    if (pcIsUserEditing()) { pcPendingRemote = remote; return; }
    pcApplyRemoteState(remote);
  }

  function pcApplyPendingIfReady() {
    if (pcPendingRemote && !pcIsUserEditing()) {
      const r = pcPendingRemote;
      pcPendingRemote = null;
      pcApplyRemoteState(r);
    }
  }

  async function pcPushNow() {
    if (!pcSupa) return;
    const state = pcCollectState();
    const json = JSON.stringify(state);
    if (json === pcLastSyncedJson) return;
    try {
      const { error } = await pcSupa
        .from('app_state')
        .upsert(
          { key: APP_KEY, data: state, updated_at: new Date().toISOString() },
          { onConflict: 'key' }
        );
      if (!error) pcLastSyncedJson = json;
    } catch (_) {}
  }

  function pcSchedulePush() {
    if (pcSuppressSync) return;
    clearTimeout(pcPushTimer);
    pcPushTimer = setTimeout(pcPushNow, 250);
  }

  // Backup push on unload via fetch keepalive so a fast refresh
  // doesn't lose the latest change before the debounced push fires.
  function pcFlushPushOnUnload() {
    if (!pcSupa) return;
    const state = pcCollectState();
    const json = JSON.stringify(state);
    if (json === pcLastSyncedJson) return;
    try {
      fetch(SUPABASE_URL + '/rest/v1/app_state?on_conflict=key', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates',
        },
        body: JSON.stringify({ key: APP_KEY, data: state, updated_at: new Date().toISOString() }),
        keepalive: true,
      }).catch(() => {});
      pcLastSyncedJson = json;
    } catch (_) {}
  }

  // Initial sync: connect Supabase, pull current state, subscribe to
  // realtime updates so other devices' changes appear instantly.
  (async function pcInitCloudSync() {
    if (!window.supabase || !SUPABASE_URL || !SUPABASE_KEY) return;
    // Skip if the placeholder values are still in place (local-only mode)
    if (SUPABASE_URL.indexOf('PASTE-') === 0 || SUPABASE_KEY.indexOf('PASTE-') === 0) return;
    pcSupa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    try {
      const { data, error } = await pcSupa
        .from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
      if (!error && data && data.data && Object.keys(data.data).length > 0) {
        pcLastSyncedJson = JSON.stringify(data.data);
        pcMaybeApplyRemote(data.data);
      } else if (Object.keys(pcCollectState()).length > 0) {
        pcSchedulePush();
      }
    } catch (_) {}
    pcSupa.channel('app_state_' + APP_KEY)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'app_state',
        filter: 'key=eq.' + APP_KEY,
      }, (payload) => {
        if (!payload.new || !payload.new.data) return;
        const incoming = JSON.stringify(payload.new.data);
        if (incoming === pcLastSyncedJson) return; // echo of our own push
        pcLastSyncedJson = incoming;
        pcMaybeApplyRemote(payload.new.data);
      })
      .subscribe();
  })();

  document.addEventListener('focusout', () => {
    setTimeout(pcApplyPendingIfReady, 0);
  }, true);
  window.addEventListener('pagehide', pcFlushPushOnUnload);
  window.addEventListener('beforeunload', pcFlushPushOnUnload);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pcFlushPushOnUnload();
  });

  // ------------------------------------------------------------
  // Cross-device day list sync (names/order/deletions), via plan-sync.js.
  // Separate from the whole-blob sync above: this only carries which days
  // exist, their names, and their order, in public.plan_days -- everything
  // else about a day (its exercises/logs) stays on the blob sync.
  // ------------------------------------------------------------
  function updatePlanSyncIndicator(status) {
    const dot = document.getElementById('planSyncDot');
    if (!dot) return;
    if (status === 'synced') { dot.style.display = 'none'; return; }
    dot.style.display = 'inline-block';
    dot.style.background = status === 'pending' ? 'var(--eq-warning, #F2C063)' : 'var(--eq-danger, #FF6B6B)';
    dot.title = status === 'pending' ? 'Syncing day changes…' : status === 'offline' ? 'Offline — day changes will sync when back online' : 'Couldn’t sync day changes';
  }
  function applyRemotePlanDaysGym(liveList) {
    if (!Array.isArray(state.days)) return;
    const byKey = {};
    state.days.forEach((d) => { byKey[d.id] = d; });
    state.days = liveList.map((d) => {
      const existing = byKey[d.key];
      return existing ? Object.assign(existing, { name: d.name }) : { id: d.key, name: d.name };
    });
    if (!state.days.length) return; // shouldn't happen -- app enforces at least one day locally
    if (!state.days.find((d) => d.id === state.filterDay)) state.filterDay = state.days[0].id;
    saveState();
    try { renderSettings(); } catch (e) {}
    try { renderAll(); } catch (e) {}
  }
  if (window.PlanSync) {
    planSync = window.PlanSync.init({
      plan: 'gym',
      getLocalSnapshot: () => state.days.map((d) => ({ key: d.id, name: d.name })),
      applyRemote: applyRemotePlanDaysGym,
      isUserEditing: pcIsUserEditing,
      onStatus: updatePlanSyncIndicator,
    });
  }

  // ============================================================
  // 6.4 TRAINING PROGRAMMING. Purely additive from here down -- no
  // existing function above this point was changed except the one-line
  // startRestTimer() call added to the set-log handler. "Programs" reuse
  // the app's own existing days/exercises/splitRotation/splitAnchor +
  // prescription engine entirely; switching one just swaps those four
  // state fields for a named snapshot and calls the app's own saveState()/
  // renderAll(), rather than building a parallel system next to a
  // 3700-line file whose internals (esp. the Supabase sync above) weren't
  // safe to fully re-derive from scratch in the time available.
  // ============================================================
  const TRAIN_PROGRAMS_KEY = 'eq.training.programs_v1';
  const TRAIN_ACTIVE_KEY = 'eq.training.activeProgramId_v1';
  const TRAIN_DECISIONS_KEY = 'eq.training.reducedDecisions_v1';
  const TRAIN_REST_KEY = 'eq.training.restSeconds_v1';
  const TRAIN_DEFAULT_REST = 90;

  function trainStoreGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function trainStoreSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function trainSlug(n) { return n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

  function trainSnapshotCurrent() {
    return { days: state.days, exercises: state.exercises, splitRotation: state.splitRotation, splitAnchor: state.splitAnchor };
  }
  // Re-walk vs equavia-pre-answers-final.md 6.4: the user's real current
  // 5-day program, seeded as this program's exercise data (per the
  // user's own explicit choice: seed into the existing flexible builder
  // rather than rebuild it). repMin/repMax/step/startWeight are the only
  // per-exercise fields this schema has (see CONFIG.defaultExercises'
  // own header comment) -- there is no target-sets-count field anywhere
  // in this app (the UI only ever counts sets actually logged that
  // session, e1RM-chart code included), so the prescribed set count from
  // the spec is encoded in each name parenthetically rather than
  // silently dropped or requiring a schema change beyond "seed the
  // data." Superset pairings (A1/A2, B1/B2) are likewise name-only, same
  // reason. startWeight/step are reasonable placeholders in the same
  // spirit as CONFIG.defaultExercises' own generic seed numbers -- the
  // user adjusts through normal logging, same as any other exercise here.
  const SPLIT5_SEED_EXERCISES = [
    { name: 'Incline press (3 sets)', gym: 'comm', day: 'upper-a', repMin: 8, repMax: 12, step: 2.5, startWeight: 40 },
    { name: 'Row (3 sets)', gym: 'comm', day: 'upper-a', repMin: 8, repMax: 12, step: 2.5, startWeight: 40 },
    { name: 'Dip or chest fly (2-3 sets)', gym: 'comm', day: 'upper-a', repMin: 8, repMax: 12, step: 2.5, startWeight: 20 },
    { name: 'Lateral raise (3 sets)', gym: 'comm', day: 'upper-a', repMin: 12, repMax: 15, step: 1.25, startWeight: 8 },
    { name: 'A1 Shrug (2 sets, superset)', gym: 'comm', day: 'upper-a', repMin: 10, repMax: 15, step: 2.5, startWeight: 30 },
    { name: 'A2 Curl (2 sets, superset)', gym: 'comm', day: 'upper-a', repMin: 10, repMax: 15, step: 1.25, startWeight: 12 },
    { name: 'Hack squat (3 sets)', gym: 'comm', day: 'lower-a', repMin: 8, repMax: 12, step: 5, startWeight: 60 },
    { name: 'Romanian deadlift (3 sets)', gym: 'comm', day: 'lower-a', repMin: 6, repMax: 10, step: 5, startWeight: 60 },
    { name: 'Leg extension (2 sets)', gym: 'comm', day: 'lower-a', repMin: 12, repMax: 15, step: 2.5, startWeight: 30 },
    { name: 'Calf raise (3 sets)', gym: 'comm', day: 'lower-a', repMin: 12, repMax: 15, step: 2.5, startWeight: 40 },
    { name: 'Hanging leg raise (3 sets)', gym: 'comm', day: 'lower-a', repMin: 10, repMax: 15, step: 1, startWeight: 0, bw: true },
    { name: 'A1 Lateral raise (3 sets, superset)', gym: 'comm', day: 'arms-shoulders', repMin: 12, repMax: 15, step: 1.25, startWeight: 8 },
    { name: 'A2 Rear delt fly (3 sets, superset)', gym: 'comm', day: 'arms-shoulders', repMin: 12, repMax: 15, step: 1.25, startWeight: 8 },
    { name: 'B1 Curl, incline or preacher (3 sets, superset)', gym: 'comm', day: 'arms-shoulders', repMin: 10, repMax: 15, step: 1.25, startWeight: 10 },
    { name: 'B2 Tricep extension or dip (3 sets, superset)', gym: 'comm', day: 'arms-shoulders', repMin: 10, repMax: 15, step: 1.25, startWeight: 15 },
    { name: 'Pull-up or lat pulldown (3 sets)', gym: 'both', day: 'upper-b', repMin: 6, repMax: 10, step: 1, startWeight: 0, bw: true },
    { name: 'Chest-supported row (3 sets)', gym: 'comm', day: 'upper-b', repMin: 8, repMax: 12, step: 2.5, startWeight: 30 },
    { name: 'Overhead press (3 sets)', gym: 'comm', day: 'upper-b', repMin: 8, repMax: 12, step: 2.5, startWeight: 30 },
    { name: 'A1 Face pull (2 sets, superset)', gym: 'comm', day: 'upper-b', repMin: 12, repMax: 15, step: 2.5, startWeight: 15 },
    { name: 'A2 Tricep extension (2 sets, superset)', gym: 'comm', day: 'upper-b', repMin: 10, repMax: 15, step: 1.25, startWeight: 15 },
    { name: 'Leg press (3 sets)', gym: 'comm', day: 'lower-b', repMin: 10, repMax: 15, step: 5, startWeight: 80 },
    { name: 'Bulgarian split squat, each leg (2 sets)', gym: 'comm', day: 'lower-b', repMin: 8, repMax: 12, step: 2.5, startWeight: 12 },
    { name: 'Nordic or sliding leg curl (3 sets)', gym: 'comm', day: 'lower-b', repMin: 8, repMax: 12, step: 1, startWeight: 0, bw: true },
    { name: 'Calf raise (3 sets)', gym: 'comm', day: 'lower-b', repMin: 12, repMax: 15, step: 2.5, startWeight: 40 },
    { name: 'Ab wheel or dead bug (3 sets)', gym: 'comm', day: 'lower-b', repMin: 8, repMax: 12, step: 1, startWeight: 0, bw: true },
  ];

  // First run: the user's REAL existing split/exercises become "Current
  // split" (preserved, not discarded) rather than being silently
  // overwritten by the two newly-requested named programs.
  function trainEnsurePrograms() {
    let programs = trainStoreGet(TRAIN_PROGRAMS_KEY);
    if (Array.isArray(programs) && programs.length) return programs;
    const today = new Date().toISOString().slice(0, 10);
    programs = [
      Object.assign({ id: 'existing', name: 'Current split' }, trainSnapshotCurrent()),
      {
        id: 'split5', name: '5-Day Split',
        days: ['Upper A', 'Lower A', 'Arms & Shoulders', 'Upper B', 'Lower B'].map((n) => ({ id: trainSlug(n), name: n })),
        exercises: SPLIT5_SEED_EXERCISES.map((e, i) => Object.assign({ id: 'split5_' + i + '_' + Date.now() }, e)),
        splitRotation: ['Upper A', 'Lower A', 'Arms & Shoulders', 'Upper B', 'Lower B'], splitAnchor: { date: today, index: 0 },
      },
      {
        id: 'split3', name: '3-Day Split',
        days: ['Upper A', 'Lower', 'Upper B'].map((n) => ({ id: trainSlug(n), name: n })),
        exercises: [], splitRotation: ['Upper A', 'Lower', 'Upper B'], splitAnchor: { date: today, index: 0 },
      },
    ];
    trainStoreSet(TRAIN_PROGRAMS_KEY, programs);
    trainStoreSet(TRAIN_ACTIVE_KEY, 'existing');
    return programs;
  }
  function trainActiveId() { return trainStoreGet(TRAIN_ACTIVE_KEY) || 'existing'; }

  function renderTrainProgramRow() {
    const programs = trainEnsurePrograms();
    const activeId = trainActiveId();
    const wrap = $('trainProgramRow');
    if (!wrap) return;
    wrap.innerHTML = '';
    programs.forEach((p) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'train-program-btn' + (p.id === activeId ? ' is-active' : '');
      btn.textContent = p.name;
      btn.addEventListener('click', () => { if (p.id !== trainActiveId()) switchProgram(p.id); });
      wrap.appendChild(btn);
    });
  }
  function switchProgram(targetId) {
    const programs = trainEnsurePrograms();
    const currentId = trainActiveId();
    const currentIdx = programs.findIndex((p) => p.id === currentId);
    if (currentIdx !== -1) programs[currentIdx] = Object.assign({ id: currentId, name: programs[currentIdx].name }, trainSnapshotCurrent());
    const target = programs.find((p) => p.id === targetId);
    if (!target) return;
    state.days = target.days;
    state.exercises = target.exercises;
    state.splitRotation = target.splitRotation;
    state.splitAnchor = { date: new Date().toISOString().slice(0, 10), index: 0 };
    state.filterDay = target.days[0] ? target.days[0].id : state.filterDay;
    state.currentEx = null;
    saveState();
    trainStoreSet(TRAIN_PROGRAMS_KEY, programs);
    trainStoreSet(TRAIN_ACTIVE_KEY, targetId);
    renderAll();
    renderTrainProgramRow();
  }

  // ---- Recovery gating (red day) ----
  // Threshold 50%, per the answered ASK FIRST question -- deliberately
  // different from 4.6's 33% recovery-low rule: that one flags a problem;
  // this one gates today's session shape, a more cautious (higher) bar
  // on purpose. Advisory only (never forced), decision logged either way
  // so a later audit pass can show whether pushing through red days cost
  // anything, per spec. The exact "-1 set/exercise" shape from the answer
  // is worded as advisory guidance here rather than a mechanically
  // enforced number: this app's exercise model tracks rep ranges and
  // weight, not a fixed target-sets-per-exercise count to decrement, and
  // adding that concept purely to dock one set felt like more schema
  // surface than the actual ask justified.
  const TRAIN_RED_THRESHOLD = 50;
  function renderRecoveryBanner() {
    const banner = $('trainRecoveryBanner');
    if (!banner) return;
    const health = trainStoreGet('eq.health.summary');
    const recovery = health && typeof health.recovery === 'number' ? health.recovery : null;
    const todayKey = new Date().toISOString().slice(0, 10);
    const decisions = trainStoreGet(TRAIN_DECISIONS_KEY) || [];
    const already = decisions.find((d) => d.date === todayKey);
    if (recovery == null || recovery >= TRAIN_RED_THRESHOLD) { banner.style.display = 'none'; return; }
    banner.style.display = '';
    banner.innerHTML = '';
    const text = document.createElement('span');
    if (already) {
      text.textContent = 'Recovery ' + recovery + '% — ' + (already.tookReduced ? 'reduced session logged for today.' : 'training as planned, logged.');
      banner.appendChild(text);
      return;
    }
    text.textContent = 'Recovery ' + recovery + '% — reduce today\'s volume (fewer sets across exercises)?';
    banner.appendChild(text);
    const btnWrap = document.createElement('div');
    btnWrap.style.cssText = 'display:flex;gap:6px;flex-shrink:0;';
    const yesBtn = document.createElement('button'); yesBtn.type = 'button'; yesBtn.textContent = 'Reduce today';
    const noBtn = document.createElement('button'); noBtn.type = 'button'; noBtn.textContent = 'Train as planned';
    noBtn.style.cssText = 'background:rgba(255,255,255,0.06);border-color:var(--border-strong);color:var(--text-2);';
    yesBtn.addEventListener('click', () => logRecoveryDecision(recovery, true));
    noBtn.addEventListener('click', () => logRecoveryDecision(recovery, false));
    btnWrap.appendChild(yesBtn); btnWrap.appendChild(noBtn);
    banner.appendChild(btnWrap);
  }
  function logRecoveryDecision(recovery, tookReduced) {
    const todayKey = new Date().toISOString().slice(0, 10);
    const decisions = (trainStoreGet(TRAIN_DECISIONS_KEY) || []).filter((d) => d.date !== todayKey);
    decisions.push({ date: todayKey, recovery, tookReduced, at: new Date().toISOString() });
    trainStoreSet(TRAIN_DECISIONS_KEY, decisions.slice(-90));
    renderRecoveryBanner();
  }

  // ---- Rest timer ----
  let trainRestInterval = null;
  function trainRestSecondsFor(ex) {
    const map = trainStoreGet(TRAIN_REST_KEY) || {};
    return (ex && map[ex.id]) || TRAIN_DEFAULT_REST;
  }
  function startRestTimer(seconds) {
    clearInterval(trainRestInterval);
    let remaining = seconds;
    const el = $('trainRestTimer');
    const num = $('trainRestTimerNum');
    if (!el || !num) return;
    el.style.display = 'flex';
    function tick() {
      const m = Math.floor(Math.max(0, remaining) / 60), s = Math.max(0, remaining) % 60;
      num.textContent = m + ':' + String(s).padStart(2, '0');
      if (remaining <= 0) { clearInterval(trainRestInterval); el.style.display = 'none'; return; }
      remaining--;
    }
    tick();
    trainRestInterval = setInterval(tick, 1000);
  }
  const restSkipBtn = $('trainRestTimerSkip');
  if (restSkipBtn) restSkipBtn.addEventListener('click', () => {
    clearInterval(trainRestInterval);
    $('trainRestTimer').style.display = 'none';
  });

  renderTrainProgramRow();
  renderRecoveryBanner();
  window.addEventListener('storage', () => { renderRecoveryBanner(); });
})();
</script>

<script>
// ============================================================
// TRAINING PLAN — ported from the retired Train page.
//
// The logger itself is that page's code, unchanged: day tabs, per-set
// logging with PR/miss classification, the rest timer, progression
// prescriptions, per-exercise history charts, swap/tune, drag-reorder
// and the new-best celebration all behave exactly as they did.
//
// What changed is only where it reads and writes. It used to own a
// separate store (window.Vitality -> "vitality_train"); it now persists
// as state.plan inside po_coach_v1 and mirrors every session into
// state.logs -- the same workout log the Progressive Overload sections
// on this page read. See the adapter block at the top of the IIFE.
// ============================================================
(function () {

/* ============================================================
   ONE WORKOUT LOG — adapters.

   This logger was written against its own per-exercise history array
   (ex.hist). Rather than rewrite ~900 lines of working logic, ex.hist is
   kept as the in-memory working copy but is no longer the source of
   truth: state.logs[<po_coach exercise id>] is, which is the same array
   the Progressive Overload / Stats / Trend / History sections above read.

   logsToPlan()  rebuilds every ex.hist from the shared log   (on load)
   planToLogs()  writes every ex.hist back into the shared log (on save)

   Entry shapes:
     shared log  { weight, reps, date:ISO, sets:[{reps,fail}] }
     ex.hist     { date:'YYYY-MM-DD', kg, sets:[{r,fail}] }
   ============================================================ */
function tpNormName(s){ return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim(); }
function tpDayKey(iso){ return String(iso==null?'':iso).slice(0,10); }

/* Resolves a plan exercise to its po_coach exercise, creating one the
   first time a lift is seen so nothing is logged into a void.

   A created exercise must carry gym + day: the Progressive Overload
   picker above filters on exactly those two fields (see getFiltered), so
   an exercise without them is in the shared log but unreachable from the
   other half of the page -- which would defeat the point of one log. It
   is filed under the training day it appears on, and 'both' gyms so no
   gym filter can hide it. */
function tpResolveExercise(S, ex, dayKey, dayName){
  S.exercises = Array.isArray(S.exercises) ? S.exercises : [];
  if(ex.poId){ const hit=S.exercises.find(e=>e.id===ex.poId); if(hit) return hit; }
  const byName = S.exercises.find(e=>tpNormName(e.name)===tpNormName(ex.name));
  if(byName){ ex.poId=byName.id; return byName; }

  // The day has to exist in the page's own day list too, or the filter it
  // is assigned to can never be selected.
  S.days = Array.isArray(S.days) ? S.days : [];
  if(dayKey && !S.days.some(d=>d.id===dayKey)) S.days.push({ id:dayKey, name:dayName||dayKey });

  const taken=new Set(S.exercises.map(e=>e.id));
  let base='tr_'+tpNormName(ex.name).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'tr_ex';
  let id=base, n=2; while(taken.has(id)) id=base+'_'+(n++);
  const created={
    id, name:ex.name||'Untitled', bw:false, startWeight:Number(ex.kg)||0,
    gym:'both', day:dayKey || (S.days[0]&&S.days[0].id) || 'push',
    repMin:Math.max(1,(Number(ex.reps)||8)-2), repMax:Number(ex.reps)||8, step:2.5,
  };
  S.exercises.push(created); ex.poId=id; return created;
}

function tpEachPlanExercise(fn){
  if(!STATE || !STATE.days) return;
  Object.keys(STATE.days).forEach(k=>{ (STATE.days[k].ex||[]).forEach(ex=>fn(ex, k, STATE.days[k].name)); });
}

function logsToPlan(){
  if(!window.PoCoach) return;
  const S=window.PoCoach.getState(); S.logs = S.logs||{};
  tpEachPlanExercise((ex,dayKey,dayName)=>{
    const target=tpResolveExercise(S, ex, dayKey, dayName);
    const entries=(S.logs[target.id]||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    ex.hist = entries.map(l=>({
      date: tpDayKey(l.date),
      kg: Number(l.weight)||0,
      sets: Array.isArray(l.sets)&&l.sets.length
        ? l.sets.map(s=>s.fail?{r:Number(s.reps)||0,fail:true}:{r:Number(s.reps)||0})
        : [{ r:Number(l.reps)||0 }],
    }));
    const last=ex.hist[ex.hist.length-1];
    if(last) ex.lastKg=last.kg;
  });
}

function planToLogs(S){
  S.logs = S.logs||{};
  tpEachPlanExercise((ex,dayKey,dayName)=>{
    const target=tpResolveExercise(S, ex, dayKey, dayName);
    const existing=S.logs[target.id]||[];
    /* Days this logger owns get replaced from ex.hist; any day it has no
       record of (e.g. a top set logged from the form above) is preserved. */
    const owned=new Set((ex.hist||[]).map(h=>tpDayKey(h.date)));
    const kept=existing.filter(l=>!owned.has(tpDayKey(l.date)));
    const written=(ex.hist||[]).map(h=>{
      const sets=(h.sets||[]).map(s=>({ reps:Number(s.r!=null?s.r:s.reps)||0, fail:!!s.fail }));
      const top=sets.reduce((a,b)=>(b.reps>a.reps?b:a), sets[0]||{reps:0});
      const prior=existing.find(l=>tpDayKey(l.date)===tpDayKey(h.date));
      return { weight:Number(h.kg)||0, reps:top.reps||0,
               date: prior ? prior.date : new Date(h.date+'T12:00:00').toISOString(),
               sets };
    });
    S.logs[target.id]=kept.concat(written).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  });
}

/* One-time import of the retired Train page's own store, for anyone who
   used it before the merge. Local cache first (instant, offline), then the
   Supabase row for a device where the plan only ever existed elsewhere. */
async function migrateFromOldTrainPage(){
  const FLAG='eq.training.mergedIntoFitness_v1';

/* Reconciles the plan_days table's view of "which days exist, their
   names, their order" into STATE. Exercise content within a day (type,
   restDay, ex[]) is NOT carried by this table -- it stays on the existing
   whole-blob sync via window.Vitality; a day that's brand new on another
   device shows up here first with a blank/default body until that blob
   sync catches up. */
function applyRemotePlanDays(liveList){
  if(!STATE) return;
  const liveKeys = liveList.map(d=>d.key);
  Object.keys(STATE.days).forEach(k=>{ if(liveKeys.indexOf(k)===-1) delete STATE.days[k]; });
  liveList.forEach(d=>{
    if(!STATE.days[d.key]) STATE.days[d.key] = { name:d.name, type:'', restDay:false, off:false, ex:[] };
    else if(STATE.days[d.key].name !== d.name) STATE.days[d.key].name = d.name;
  });
  STATE.order = liveKeys;
  if(!STATE.days[STATE.active]) STATE.active = STATE.order[0];
  logsToPlan();

  // introduces. The sections above already rendered their pickers by now,
  // so persist and re-render them, otherwise a lift logged here would sit
  // in the shared log but be unselectable in the overload picker until
  // the next page load.
  if(window.PoCoach){ const S=window.PoCoach.getState(); S.plan=STATE; window.PoCoach.save(); window.PoCoach.refresh(); }

}

function sortedEx(day){ return day.ex.map((e,i)=>({e,i})).sort((a,b)=> (b.e.pinned-a.e.pinned)).map(o=>o.e); }
function prescription(e){ const kg = e.deload ? r1(e.kg*0.9) : e.kg; return { kg, reps:e.reps, sets:e.sets, rest:e.rest }; }
function classifySet(e, idx){ const s=e.log[idx]; if(!s) return 'empty'; if(s.fail) return 'failed'; return 'done'; }
function bestKg(e){ const real=e.hist.filter(s=>!s.off); return real.length? Math.max(...real.map(s=>s.kg)) : 0; }
function bestKgExclToday(e){ const real=e.hist.filter(s=>!s.off && s.date!==today); return real.length? Math.max(...real.map(s=>s.kg)) : 0; }
function bestRepsAt(e, kg){ const real=e.hist.filter(s=>!s.off && s.kg===kg); let m=0; real.forEach(s=>{ const t=Math.max(...s.sets.filter(x=>!x.fail).map(x=>x.r||0),0); if(t>m)m=t; }); return m; }
function isPR(e, idx){ const s=e.log[idx]; if(!s||s.fail) return false; const pb=bestKgExclToday(e); if(pb<=0) return false; if(s.kg>pb) return true; if(s.kg===pb && s.reps>bestRepsAt(e,pb)) return true; return false; }
function exDoneCount(e){ return e.log.filter(s=>s&&!s.fail).length; }
function exComplete(e){ return e.log.length>0 && e.log.every(s=>s&&!s.fail); }
function exHasPR(e){ return e.log.some((s,i)=>isPR(e,i)); }
function exHasMiss(e){ return e.log.some(s=>s&&s.fail); }
function dayTotals(day){ if(day.off||day.restDay) return {logged:0,total:0}; let logged=0,total=0; day.ex.forEach(e=>{ total+=e.log.length; logged+=e.log.filter(s=>s&&(s.fail||true)&&s).length; }); return {logged,total}; }

function beginDayTitleEdit(h1, d){
  if(h1.dataset.editing) return;
  h1.dataset.editing='1';
  const original=d.name;
  h1.onpointerdown=h1.onpointerup=h1.onpointerleave=h1.onpointercancel=h1.onkeydown=null;
  h1.innerHTML='<input class="daytitleInput" id="daytitleInput" type="text" maxlength="40" value="'+escapeHtml(original)+'"><span class="daytitleErr" id="daytitleErr"></span>';
  const inp=$('#daytitleInput');
  inp.focus(); inp.select();
  inp.addEventListener('pointerdown', ev=>ev.stopPropagation());
  inp.addEventListener('click', ev=>ev.stopPropagation());
  let settled=false;
  const finish=(commit)=>{
    if(settled) return;
    if(commit){
      const v=inp.value.trim().slice(0,40);
      if(!v){
        inp.value=original;
        inp.classList.add('shake');
        const err=$('#daytitleErr'); if(err) err.textContent='Name can’t be empty';
        setTimeout(()=>{ inp.classList.remove('shake'); const e2=$('#daytitleErr'); if(e2) e2.textContent=''; },1600);

    settled=true;
    delete h1.dataset.editing;
    render();

  inp.addEventListener('keydown', ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter'){ ev.preventDefault(); finish(true); }
    else if(ev.key==='Escape'){ ev.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', ()=>finish(true));

/* Progression rule (replaces any prior rule): +2.5kg once every logged
   set that session met or beat the exercise's target reps; if the lift
   has no load to add to (bodyweight, kg=0 -- a jump isn't practical
   there), add a rep instead. Only fires on a fully-logged session (every
   prescribed set present) and only on the today->submitted transition,
   never on re-lock/undo, so it can't double-apply. */
function applyProgression(d){
  d.ex.forEach(e=>{
    const logged = e.log.filter(s=>s);
    if(logged.length < e.sets) return;
    const allHitTarget = logged.every(s=>!s.fail && s.reps>=e.reps);
    if(!allHitTarget) return;
    if(e.kg > 0) e.kg = r1(e.kg + 2.5);
    else e.reps = e.reps + 1;
  });
}
function renderFinish(d){
  const btn=$('#finishBtn'); const t=dayTotals(d);
  if(STATE.submitted){ btn.textContent='re-lock session'; btn.classList.add('locked'); btn.disabled=false; }
  else { btn.textContent='finish session'; btn.classList.remove('locked'); btn.disabled = t.logged===0; }
  btn.onclick=()=>{
    const wasSubmitted = STATE.submitted;
    STATE.submitted=!STATE.submitted;
    if(!wasSubmitted && STATE.submitted) applyProgression(d);
    renderFinish(d); saveState();
  };
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPill(e, rx, idx){
  const kind=classifySet(e, idx); const s=e.log[idx]; const logged=kind!=='empty';
  const prefillKg = s?s.kg:(e.lastKg!=null?e.lastKg:rx.kg);
  const prefillR = s?s.reps:rx.reps;
  const pr = isPR(e, idx);
  const row=document.createElement('div'); row.className='pill '+(kind==='failed'?'failed':(kind==='done'?'done':''))+(logged?'':' tappable');
  let status='done';
  if(kind==='done'){ const dr=s.reps-rx.reps; if(dr>0) status='done <span class="sub">· +'+dr+'</span>'; else if(dr<0) status='done <span class="sub">· '+s.reps+' reps</span>'; else status='done'; }
  else if(kind==='failed') status='missed';
  row.innerHTML =
    '<span class="pillIdx">'+(ROMAN[idx]||idx+1)+'</span>'
    + '<span class="pillValue">'
    +   '<input class="pillInput w" type="number" inputmode="decimal" value="'+prefillKg+'" aria-label="Weight" />'
    +   '<span class="pillUnit">'+STATE.unit+(e.perHand?'<span class="pillPerHand">/ea</span>':'')+'</span>'
    +   '<span class="pillTimes">×</span>'
    +   '<input class="pillInput r" type="number" inputmode="numeric" value="'+prefillR+'" aria-label="Reps" />'
    + '</span>'
    + '<span class="pillSpacer"></span>'
    + '<div class="pillActions">'
    + (logged
        ? '<span class="pillStatus">'+(pr?'<span class="pillPr">★ </span>':'')+status+'</span><button class="pillReset" aria-label="Undo set">'+IC_reset()+'</button>'
        : '<button class="pillHit" aria-label="Log set">hit it →</button><button class="pillMiss" aria-label="Mark missed">miss</button>')
    + '</div>';
  const wIn=row.querySelector('.w'), rIn=row.querySelector('.r');
  const commit=()=>{ const kg=parseFloat(wIn.value); const reps=Math.round(parseFloat(rIn.value)); if(!Number.isFinite(kg)||kg<0||!Number.isFinite(reps)||reps<0) return; if(reps===0){ doLog(e, idx, kg, 0, true); } else { doLog(e, idx, kg, reps, false); } };
  const stop=ev=>ev.stopPropagation();
  [wIn,rIn].forEach(inp=>{ inp.addEventListener('click',stop); inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); commit(); inp.blur(); } }); });
  if(!logged) row.addEventListener('click', commit);
  const hit=row.querySelector('.pillHit'); if(hit) hit.addEventListener('click',ev=>{ stop(ev); commit(); });
  const miss=row.querySelector('.pillMiss'); if(miss) miss.addEventListener('click',ev=>{ stop(ev); const kg=parseFloat(wIn.value)|| (e.lastKg!=null?e.lastKg:rx.kg); doLog(e, idx, kg, 0, true); });
  const reset=row.querySelector('.pillReset'); if(reset) reset.addEventListener('click',ev=>{ stop(ev); e.log[idx]=null; stopRest(e.id); render(); });
  return row;
}
function IC_reset(){ return '<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor"><path d="M3.5 6.5 A6 6 0 1 0 6 3.2"/><polyline points="2.4 2.4 3.7 6.6 8 5.2"/></svg>'; }

function doLog(e, idx, kg, reps, fail){
  const wasComplete = exComplete(e);
  const pbBefore = bestKgExclToday(e);
  e.log[idx] = fail ? {kg, reps:0, fail:true} : {kg, reps};
  rollupToday(e);
  render();
  // re-find the live card + pill for the shimmer / celebration
  const card=document.querySelector('.ex[data-id="'+e.id+'"]');
  if(!fail && card){ const pills=card.querySelectorAll('.pill'); const rowEl=pills[idx]; if(rowEl){ rowEl.classList.add('shimmer'); setTimeout(()=>rowEl.classList.remove('shimmer'),820); } }
  // progressive-overload celebration: a logged set that beats your prior best, completing the lift
  if(!fail && pbBefore>0 && (kg>pbBefore || (kg===pbBefore))){
    const beats = kg>pbBefore || (kg===pbBefore && reps>bestRepsAt(e,pbBefore));
    if(beats && !wasComplete && exComplete(e) && card){ card.classList.add('celebrate'); setTimeout(()=>card.classList.remove('celebrate'),1650); celebrate(e, kg, reps); }
  }
  if(!fail) startRest(e);
}
function rollupToday(e){
  const done = e.log.filter(s=>s&&!s.fail);
  e.hist = e.hist.filter(h=>h.date!==today);
  if(done.length){ const top=done.reduce((a,b)=>b.kg>a.kg?b:a); const sets=e.log.filter(s=>s).map(s=>s.fail?{r:s.reps,fail:true}:{r:s.reps}); e.hist.push({date:today, kg:top.kg, sets}); e.hist.sort((a,b)=>a.date.localeCompare(b.date)); e.lastKg=top.kg; }
}

/* ---- header actions router --------------------------------------- */
function handleAct(act, e, day, btn){
  if(act==='eye'){ e.collapsed=!e.collapsed; render(); }
  else if(act==='pin'){ e.pinned=!e.pinned; render(); }
  else if(act==='form'){ openForm(e); }
  else if(act==='history'){ openHistory(e); }
  else if(act==='swap'){ openSwap(e); }
  else if(act==='tune'){ openTune(e); }
  else if(act==='progression'){ openProgression(e); }
  else if(act==='menu'){ openMenu(e, day, btn); }
}

/* ====================================================================
   REST TIMER
   ================================================================= */
const restTimers={};
function startRest(e){ stopRest(e.id); const rx=prescription(e); restTimers[e.id]={remaining:rx.rest, handle:null}; tickRest(e); const card=document.querySelector('.ex[data-id="'+e.id+'"]'); if(card) mountRestBar(card, e); }
function tickRest(e){ const t=restTimers[e.id]; if(!t) return; t.handle=setInterval(()=>{ t.remaining-=1; updateRest(e.id); },1000); }
function stopRest(id){ const t=restTimers[id]; if(t&&t.handle) clearInterval(t.handle); delete restTimers[id]; }
function mountRestBar(card, e){ const slot=card.querySelector('.restSlot'); const t=restTimers[e.id]; if(!t||!slot){ if(slot)slot.innerHTML=''; return; }
  const over=t.remaining<=0;
  slot.innerHTML='<div class="restbar'+(over?' over':'')+'"><button class="restStep" data-d="-15">−15</button><div class="restMid"><div class="restTime">'+(over?'go →':mmss(Math.max(0,t.remaining)))+'</div><div class="restLabel">'+e.name+'</div></div><button class="restStep" data-d="15">+15</button><button class="restX" aria-label="Dismiss">×</button></div>';
  slot.querySelector('[data-d="-15"]').onclick=()=>{ t.remaining-=15; updateRest(e.id); };
  slot.querySelector('[data-d="15"]').onclick=()=>{ t.remaining+=15; updateRest(e.id); };
  slot.querySelector('.restX').onclick=()=>{ stopRest(e.id); slot.innerHTML=''; };
}
function updateRest(id){ const card=document.querySelector('.ex[data-id="'+id+'"]'); const t=restTimers[id]; if(!card||!t) return; const bar=card.querySelector('.restbar'); if(!bar) return; const over=t.remaining<=0; bar.classList.toggle('over',over); bar.querySelector('.restTime').textContent= over?'go →':mmss(Math.max(0,t.remaining)); }

/* ====================================================================
   DRAG TO REORDER
   ================================================================= */
function wireDrag(card, e, day){
  const grip=card.querySelector('.grip'); if(!grip) return;
  grip.addEventListener('pointerdown', ev=>{
    if(e.pinned){ return; } // pinned lifts hold the top
    ev.preventDefault(); grip.classList.add('dragging'); card.classList.add('drag-ghost');
    const wrap=$('#exwrap'); const cards=[...wrap.querySelectorAll('.ex')];
    const move=mev=>{ const y=mev.clientY; let target=null; cards.forEach(c=>{ if(c===card) return; const r=c.getBoundingClientRect(); if(y>r.top && y<r.bottom) target=c; }); if(target){ const r=target.getBoundingClientRect(); const after = y > r.top + r.height/2; wrap.insertBefore(card, after?target.nextSibling:target); } };
    const up=()=>{ grip.classList.remove('dragging'); card.classList.remove('drag-ghost'); document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      // commit new order to the day array (respecting pins at top)
      const ids=[...wrap.querySelectorAll('.ex')].map(c=>c.dataset.id);
      day.ex.sort((a,b)=> ids.indexOf(a.id)-ids.indexOf(b.id));
      render(); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}

/* ---- history popup (the /overload tracker) ----------------------- */
const RANGES={ W:7, M:30, '3M':90, '6M':180, Y:365, ALL:99999 };
function openHistory(e){
  let active='ALL';
  openPop(popHead('History', e.name)
    + '<div class="range" id="hrange"></div>'
    + '<div class="chart-card"><div class="plot" id="hplot"></div><div class="delta-cap" id="hcap"></div></div>'
    + '<div class="stats" id="hstats"></div>'
    + '<table class="hist"><thead><tr><th>Date</th><th>Sets</th><th>Reps</th><th>Weight</th><th>Progress</th></tr></thead><tbody id="hbody"></tbody></table>',
    ()=>{ drawHistory(e, active, v=>{active=v;}); });
}
function drawHistory(e, active, setActive){
  const rangeEl=$('#hrange');
  rangeEl.innerHTML=Object.keys(RANGES).map(k=>'<button class="'+(k===active?'on':'')+'" data-r="'+k+'">'+k+'</button>').join('');
  rangeEl.querySelectorAll('button').forEach(b=> b.onclick=()=>{ setActive(b.dataset.r); drawHistory(e, b.dataset.r, setActive); });
  const all=e.hist.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const list=all.filter(s=>daysAgo(s.date)<=RANGES[active]);
  drawChart(e, list, active);
  drawStats(e);
  drawTable(e, all);
}
function topReps(s){ const d=(s.sets||[]).filter(x=>!x.fail).map(x=>x.r); return d.length?Math.max(...d):0; }
function setCount(s){ return (s.sets||[]).length; }
function drawChart(e, list, active){
  const plot=$('#hplot'), cap=$('#hcap');
  if(!list.length){ plot.innerHTML='<svg viewBox="0 0 600 240" preserveAspectRatio="none"><text class="xlab" x="300" y="120" text-anchor="middle">log your first session to start the chart</text></svg>'; cap.textContent=''; return; }
  const VB_W=600,VB_H=240,PADL=46,PADR=20,PADT=22,PADB=36;
  const real=list.filter(s=>!s.off), off=list.filter(s=>s.off);
  const ws=list.map(s=>s.kg);
  let lo=Math.max(0,Math.floor(Math.min(...ws)/5)*5-5), hi=Math.ceil(Math.max(...ws)/5)*5+5;
  if(hi-lo<10) hi=lo+10; if((hi-lo)%10!==0) hi+=5;
  const oldestAgo=Math.max(...list.map(s=>daysAgo(s.date)));
  const domain= active==='ALL'? Math.max(oldestAgo,1):Math.max(RANGES[active],1);
  const X=k=>{ const f=Math.min(1,Math.max(0,1-daysAgo(k)/domain)); return PADL+f*(VB_W-PADL-PADR); };
  const Y=kg=>(VB_H-PADB)-(kg-lo)/(hi-lo)*(VB_H-PADB-PADT);
  const step=(hi-lo)<=30?5:10;
  const best = real.length? real.reduce((b,s)=>(s.kg>b.kg||(s.kg===b.kg&&topReps(s)>topReps(b)))?s:b) : null;
  let svgs='<svg viewBox="0 0 '+VB_W+' '+VB_H+'" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mint);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--mint);stop-opacity:0"/></linearGradient></defs>';
  for(let kg=lo;kg<=hi;kg+=step){ svgs+='<line class="grid" x1="'+PADL+'" y1="'+Y(kg)+'" x2="'+(VB_W-PADR)+'" y2="'+Y(kg)+'"/><text class="axis-label" x="'+(PADL-10)+'" y="'+(Y(kg)+4)+'" text-anchor="end">'+kg+'</text>'; }
  if(real.length){ const pts=real.map(s=>X(s.date)+','+Y(s.kg)); const last=real[real.length-1], first=real[0];
    if(real.length>1){ svgs+='<path class="area" d="M'+X(first.date)+','+(VB_H-PADB)+' L'+pts.join(' L')+' L'+X(last.date)+','+(VB_H-PADB)+' Z"/><polyline class="line" points="'+pts.join(' ')+'"/>'; } }
  off.forEach(s=>{ svgs+='<circle class="dot off" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  real.forEach(s=>{ svgs+='<circle class="dot'+(best&&s.date===best.date?' best':'')+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  svgs+='<text class="xlab" x="'+PADL+'" y="'+(VB_H-6)+'" text-anchor="start">'+fmtDate(list[0].date)+'</text><text class="xlab" x="'+(VB_W-PADR)+'" y="'+(VB_H-6)+'" text-anchor="end">today</text></svg>';
  plot.innerHTML=svgs;
  if(real.length>=2){ const d=r1(real[real.length-1].kg-real[0].kg); cap.innerHTML=(d>=0?'+':'')+d+' '+STATE.unit+' <span class="mu">· '+(active==='ALL'?'all time':'in '+active)+'</span>'; }
  else cap.textContent= real.length?'one session here':'';
}
function drawStats(e){
  const real=e.hist.filter(s=>!s.off);
  const best=real.length?Math.max(...real.map(s=>s.kg)):0;
  const w30=real.filter(s=>daysAgo(s.date)<=30); const d30=w30.length>=2?r1(w30[w30.length-1].kg-w30[0].kg):0;
  $('#hstats').innerHTML='<div class="stat"><div class="k">Sessions</div><div class="v">'+real.length+'</div></div><div class="stat"><div class="k">Last 30 days</div><div class="v up">'+(d30>=0?'+':'')+d30+' '+STATE.unit+'</div></div><div class="stat"><div class="k">Best</div><div class="v gold">'+best+' '+STATE.unit+'</div></div>';
}
function drawTable(e, all){
  const body=$('#hbody');
  if(!all.length){ body.innerHTML='<tr><td colspan="5"><div class="emptyHist">No sessions yet. Log a set and it lands here.</div></td></tr>'; return; }
  const real=all.filter(s=>!s.off);
  const best= real.length? real.reduce((b,s)=>(s.kg>b.kg||(s.kg===b.kg&&topReps(s)>topReps(b)))?s:b):null;
  body.innerHTML=all.slice().reverse().slice(0,10).map(s=>{
    const prevReal=real.filter(x=>x.date<s.date); const prev=prevReal.length?prevReal[prevReal.length-1]:null;
    const d=prev?r1(s.kg-prev.kg):null; const isBest=best&&s.date===best.date && !s.off;
    const prog = s.off? '<td class="prog first">rest</td>' : (d==null?'<td class="prog first">first</td>':'<td class="prog">'+(d>=0?'+':'')+d+'</td>');
    const w = isBest? '<td><span class="best-w">'+svg('<path d="M12 3.5l2.5 5.1 5.6.8-4 3.9 1 5.6L12 16.9 6.9 18.9l1-5.6-4-3.9 5.6-.8z"/>')+'<span class="num">'+s.kg+'</span> <span class="u">'+STATE.unit+'</span></span></td>' : '<td><span class="num">'+s.kg+'</span> <span class="u">'+STATE.unit+'</span></td>';
    return '<tr><td>'+fmtDate(s.date)+'</td><td>'+setCount(s)+'</td><td>'+topReps(s)+'</td>'+w+prog+'</tr>';
  }).join('');
}

/* ---- tune popup --------------------------------------------------- */
function openTune(e){
  const draft={ kg:e.kg, reps:e.reps, sets:e.sets, rest:e.rest };
  const loggedCount=e.log.filter(s=>s).length;
  openPop(popHead('Tune · '+(curDay().type||'session')+' day', e.name)
    + '<div style="margin-top:18px"></div>'
    + fieldRow('Weight','<input class="wInput" id="tw" type="number" inputmode="decimal" step="0.5" value="'+draft.kg+'"><span class="wUnit">'+STATE.unit+(e.perHand?'/ea':'')+'</span>', 'weight')
    + stepRow('Sets','tsets', draft.sets)
    + stepRow('Reps','treps', draft.reps)
    + stepRow('Rest','trest', mmss(draft.rest))
    + '<div class="popBtns"><button class="pbtn ghost" id="tcancel">cancel</button><button class="pbtn save" id="tsave">save</button></div>',
    scrim=>{
      const sync=()=>{ scrim.querySelector('#tsets .stepVal').textContent=draft.sets; scrim.querySelector('#treps .stepVal').textContent=draft.reps; scrim.querySelector('#trest .stepVal').textContent=mmss(draft.rest); };
      scrim.querySelector('#tw').oninput=ev=>{ const v=parseFloat(ev.target.value); if(Number.isFinite(v)) draft.kg=v; };
      scrim.querySelectorAll('.step').forEach(b=> b.onclick=()=>{ const f=b.dataset.f, d=+b.dataset.d;
        if(f==='rest'){ draft.rest=Math.max(0,draft.rest+d*15); }
        else if(f==='sets'){ draft.sets=Math.min(8,Math.max(Math.max(1,loggedCount),draft.sets+d)); }
        else if(f==='reps'){ draft.reps=Math.min(50,Math.max(1,draft.reps+d)); }
        sync(); });
      scrim.querySelector('#tcancel').onclick=closePop;
      scrim.querySelector('#tsave').onclick=()=>{ e.kg=Number.isFinite(draft.kg)?draft.kg:e.kg; e.reps=draft.reps; e.rest=draft.rest;
        // grow / shrink the set list, keeping logged sets
        if(draft.sets>e.log.length){ while(e.log.length<draft.sets) e.log.push(null); }
        else if(draft.sets<e.log.length){ e.log=e.log.slice(0,Math.max(loggedCount,draft.sets)); }
        e.sets=e.log.length; closePop(); render(); };
    });
}
function fieldRow(label, ctl, icon){ const ic={weight:'<path d="M7 9v6M17 9v6M4 12h3M17 12h3M9 9h6v6H9z"/>'}[icon]||''; return '<div class="field"><span class="lbl">'+svg(ic,' fill="none" stroke="currentColor"')+label+'</span><div class="stepper">'+ctl+'</div></div>'; }
function stepRow(label, id, val){ const f=id==='tsets'?'sets':(id==='treps'?'reps':'rest'); return '<div class="field" id="'+id+'"><span class="lbl">'+label+'</span><div class="stepper"><button class="step minus" data-f="'+f+'" data-d="-1">−</button><span class="stepVal">'+val+'</span><button class="step" data-f="'+f+'" data-d="1">+</button></div></div>'; }

/* ---- progression popup -- reads the classic Progressive Overload
   Coach's own logs/formulas via window.PoCoach (see its bridge object
   in script A), so there's one shared definition of best-set/1RM/
   next-session suggestion instead of a second one invented here. ---- */
function openProgression(e){
  openPop(popHead('Progression', e.name) + '<div id="progBody"></div>', () => { drawProgression(e); });
}
function drawProgression(e){
  const body = $('#progBody');
  const PC = window.PoCoach;
  const st = PC && PC.getState();
  const poEx = (st && e.poId) ? st.exercises.find(x => x.id === e.poId) : null;
  const logs = (st && e.poId && st.logs[e.poId]) || [];
  if (!PC || !poEx || !logs.length) {
    body.innerHTML = '<div class="po-empty">Log a set for this exercise to see progression stats.</div>';
    return;
  }
  const unit = st.units;
  const oneRm = poEx.bw
    ? Math.max.apply(null, logs.map(l => l.reps)) + ' reps'
    : Math.round(Math.max.apply(null, logs.map(l => PC.estimate1RM(l.weight, l.reps)))) + unit;
  let best = logs[0];
  logs.forEach(l => { if (PC.scoreForLog(poEx, l) > PC.scoreForLog(poEx, best)) best = l; });
  const bestStr = poEx.bw ? (best.reps + ' reps') : (best.weight + '×' + best.reps);

  let html = '<div class="stats">'
    + '<div class="stat"><div class="k">Est. 1RM</div><div class="v gold">' + oneRm + '</div></div>'
    + '<div class="stat"><div class="k">Best Set</div><div class="v">' + bestStr + '</div></div>'
    + '<div class="stat"><div class="k">Sessions</div><div class="v">' + logs.length + '</div></div>'
    + '</div>';

  const trend = PC.topSetPerDay(poEx, logs).slice(-10);
  if (trend.length < 2) {
    html += '<div class="po-spark-caption">Trend (last 10 sessions)</div><div class="po-empty">Need 2+ sessions for a trend.</div>';
  } else {
    const vals = trend.map(l => poEx.bw ? l.reps : PC.estimate1RM(l.weight, l.reps));
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const range = max - min || 1;
    const W = 300, H = 60, pad = 4;
    const pts = vals.map((v, i) => [pad + (W - pad * 2) * (i / (vals.length - 1)), H - pad - (H - pad * 2) * ((v - min) / range)]);
    const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const fillPath = linePath + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + H + ' L' + pts[0][0].toFixed(1) + ' ' + H + ' Z';
    html += '<div class="po-spark-caption">Trend (last ' + trend.length + ' sessions)</div>'
      + '<div class="po-spark-wrap"><svg class="po-spark-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
      + '<defs><linearGradient id="progSparkGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="rgba(255,255,255,0.18)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></linearGradient></defs>'
      + '<path fill="url(#progSparkGrad)" d="' + fillPath + '"/><path class="po-spark-line" fill="none" d="' + linePath + '"/></svg></div>';
  }

  const rx = PC.getRx(poEx, logs);
  if (rx) {
    const head = rx.bw ? ('<span class="po-accent">' + rx.reps + ' reps</span>') : ('<span class="po-accent">' + rx.weight + unit + '</span> × ' + rx.reps + ' reps');
    html += '<div class="po-rx-card po-rx-' + rx.type + '"><div class="po-rx-label">Next session</div><div class="po-rx-headline">' + head + '</div><span class="po-rx-tag ' + rx.type + '">' + rx.tag + '</span><p class="po-rx-reason">' + rx.reason + '</p></div>';
  }
  body.innerHTML = html;
}

/* ---- overflow menu (remove / deload / note) ---------------------- */
function openMenu(e, day, btn){
  const root=$('#popRoot');
  const r=btn.getBoundingClientRect();
  root.innerHTML='<div class="scrim" id="scrim" style="background:transparent"><div class="menuPop" id="menuPop"></div></div>';
  const scrim=$('#scrim'); const menu=$('#menuPop');
  menu.innerHTML=
    '<button data-m="deload">'+svg('<path d="M12 5v9M8 11l4 4 4-4M5 19h14"/>',' fill="none" stroke="currentColor"')+(e.deload?'Remove deload':'Deload this lift')+'</button>'
    + '<button data-m="note">'+svg('<path d="M4 5h16M4 12h16M4 19h10"/>',' fill="none" stroke="currentColor"')+(e.note?'Edit note':'Add a note')+'</button>'
    + '<div class="sep"></div>'
    + '<button class="danger" data-m="remove">'+svg('<path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/>',' fill="none" stroke="currentColor"')+'Remove from day</button>';
  // position near the button, clamped to viewport
  const mw=190; let left=Math.min(r.right-mw, window.innerWidth-mw-10); left=Math.max(10,left); let top=r.bottom+6;
  menu.style.left=left+'px'; menu.style.top=top+'px';
  escHandler=ev=>{ if(ev.key==='Escape') closePop(); }; document.addEventListener('keydown',escHandler);
  scrim.addEventListener('click',ev=>{ if(ev.target===scrim) closePop(); });
  menu.querySelectorAll('button').forEach(b=> b.onclick=()=>{
    const m=b.dataset.m; closePop();
    if(m==='deload'){ e.deload=!e.deload; render(); }
    else if(m==='note'){ openNote(e); }
    else if(m==='remove'){ confirmRemove(e, day); }
  });
}
function openNote(e){
  // inline note editor under the card
  render();
  const card=document.querySelector('.ex[data-id="'+e.id+'"]'); if(!card) return;
  const meta=card.querySelector('.exMeta');
  const ed=document.createElement('div'); ed.className='noteEdit';
  ed.innerHTML='<input id="noteIn" placeholder="A note for this lift" value="'+escapeHtml(e.note||'')+'"><button id="noteSave">save</button>';
  meta.insertAdjacentElement('afterend', ed);
  const inp=ed.querySelector('#noteIn'); inp.focus();
  const save=()=>{ e.note=inp.value.trim(); render(); };
  ed.querySelector('#noteSave').onclick=save;
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter') save(); if(ev.key==='Escape'){ render(); } });
}
function confirmRemove(e, day){
  openPop(popHead('Remove', e.name)
    + '<p class="formGist" style="font-size:15px;font-weight:500;color:var(--muted-strong)">Your logged history is kept. This only removes '+e.name+' from your '+day.name+' day.</p>'
    + '<div class="popBtns"><button class="pbtn ghost" id="rcancel">Keep it</button><button class="pbtn danger" id="ryes">Remove</button></div>',
    scrim=>{ scrim.querySelector('#rcancel').onclick=closePop; scrim.querySelector('#ryes').onclick=()=>{ const i=day.ex.findIndex(x=>x.id===e.id); if(i>=0) day.ex.splice(i,1); stopRest(e.id); closePop(); render(); }; });
}

/* ---- celebrate ---------------------------------------------------- */
function celebrate(e, kg, reps){
  const heavier=r1(kg+2.5);
  $('#ch2').innerHTML='You beat your best on '+e.name+'. Next time, chase <span class="goal">'+heavier+' '+STATE.unit+'</span> or <span class="goal">'+kg+' '+STATE.unit+' × '+(reps+1)+'</span>.';
  const c=$('#celebrate'); c.classList.add('on'); c.onclick=()=>c.classList.remove('on');
}

/* ---- start fresh -------------------------------------------------- */
function wireFresh(){
  const fb=$('#freshbtn'); let armed=false, timer=null;
  fb.onclick=()=>{
    if(!armed){ armed=true; fb.textContent='Tap again to wipe this device'; fb.classList.add('arm'); timer=setTimeout(()=>{ armed=false; fb.textContent='Start fresh'; fb.classList.remove('arm'); },3000); return; }
    clearTimeout(timer); armed=false; fb.textContent='Start fresh'; fb.classList.remove('arm');
    Object.keys(restTimers).forEach(stopRest);
    STATE=buildState(); STATE.submitted=false; render();
  };
}

/* ---- inlined backdrop particles (self-contained) ------------------ */
function spawnParticles(root){
  if(!root) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const N = window.innerWidth<640?10:18;
  for(let i=0;i<N;i++){ const s=document.createElement('span'); const dur=18+Math.random()*22, size=1+Math.random()*1.2;
    s.style.left=(Math.random()*100)+'%'; s.style.top=(60+Math.random()*40)+'vh'; s.style.width=s.style.height=size+'px';
    s.style.animationDuration=dur+'s'; s.style.animationDelay=(-Math.random()*dur)+'s';
    s.style.setProperty('--dx',(Math.random()*30-15)+'px'); s.style.setProperty('--dy',(-(60+Math.random()*50))+'vh'); root.appendChild(s); }
}

/* ---- boot: load state from the dashboard bridge, THEN render -------
   window.Vitality is injected by the dashboard — we never define it. load()
   returns [] when empty, or the saved STATE object; render only after it resolves. */
(async()=>{
  let d=null;
  try{ d = (window.PoCoach && window.PoCoach.getState().plan) || null; }catch(e){ d=null; }
  if(!d) d = await migrateFromOldTrainPage();
  STATE = (d && typeof d==='object' && !Array.isArray(d) && d.days) ? d : buildState();
  // Back-compat: saved state from before tabs were customizable has no
  // .order — derive one from whatever days exist. Also drop any stale
  // order entries left over from a delete that didn't fully persist.
  if(!STATE.order || !Array.isArray(STATE.order)) STATE.order = Object.keys(STATE.days);
  STATE.order = STATE.order.filter(k=>STATE.days[k]);
  if(!STATE.order.length) STATE.order = Object.keys(STATE.days);
  if(!STATE.days[STATE.active]) STATE.active = STATE.order[0];
  if(window.PlanSync){
    planSync = window.PlanSync.init({
      plan: 'train',
      getLocalSnapshot: () => STATE.order.map(k=>({ key:k, name:(STATE.days[k]||{}).name||k })),
      applyRemote: applyRemotePlanDays,
      onStatus: updatePlanSyncIndicator,
    });
  }
  render(); wireFresh();

})();
})();
</script>
