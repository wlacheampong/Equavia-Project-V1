<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<link rel="icon" type="image/webp" href="images/Index Landing Page.webp">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project Equavia">
<title>Project Equavia</title>
<link rel="stylesheet" href="css/equavia-core.css">
<style>
:root {
  --text-primary: var(--eq-text-primary);
  --text-secondary: var(--eq-text-secondary);
  --text-tertiary: var(--eq-text-muted);
  --font: var(--eq-font-family);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  min-height: 100%;
  background: var(--eq-bg-primary);
  color: var(--text-primary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Same ambient backdrop as the dashboard, so the landing page reads as
   part of the same app rather than a separate splash screen. */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(var(--eq-accent-rgb), 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(var(--eq-text-primary-rgb), 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -1;
}

/* ==========================================================================
   Phase 08.2 loading state -- centred logo in a soft circular surface on
   the page background, per refs/22-loading-logo-state.png. Fades out
   once the real content below is ready (there's no real async fetch on
   this page -- everything reads synchronously from localStorage -- so
   this is a short deliberate branded transition, not a fetch spinner).
   ========================================================================== */
.eq-loading-screen {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: var(--eq-bg-primary);
  opacity: 1; transition: opacity 0.45s ease-out;
}
.eq-loading-screen.is-hidden { opacity: 0; pointer-events: none; }
.eq-loading-orb {
  width: 88px; height: 88px; border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--eq-text-primary-rgb), 0.12), rgba(var(--eq-text-primary-rgb), 0.02) 70%);
  display: flex; align-items: center; justify-content: center;
  animation: eq-loading-pulse 1.8s ease-in-out infinite;
}
.eq-loading-orb img { width: 36px; height: 36px; opacity: 0.92; border-radius: 8px; }
@keyframes eq-loading-pulse {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.06); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .eq-loading-screen { transition: none; }
  .eq-loading-orb { animation: none; }
}

.landing {
  position: relative;
  max-width: 1040px;
  margin: 0 auto;
  padding: max(28px, env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  opacity: 0;
  animation: landing-fade-in 0.7s ease-out 0.25s forwards;
}
@keyframes landing-fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .landing { animation: none; opacity: 1; }
}

.landing-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 22px; flex-wrap: wrap;
}
.landing-greeting { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.landing-greeting-sub { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }
.landing-status { text-align: right; font-size: 13px; color: var(--text-secondary); }
.landing-status-date { font-weight: 600; color: var(--text-primary); }

/* Hero slot -- Phase 08.2's open decision #4 is exactly which element
   here plays the reference's hero role and at what size; deliberately
   left EMPTY (not a guessed placement/size for images/splash-red-wing.jpg,
   the asset from the previous single-image landing page) rather than
   picked, per the phase doc's own instruction: "build the layout, leave
   the hero slot, fill it once the intent is confirmed." */
.landing-hero-slot {
  border: 1px dashed var(--eq-border-strong); border-radius: var(--eq-card-radius);
  padding: 18px; margin-bottom: 22px;
  display: flex; align-items: center; justify-content: center;
  min-height: 96px;
  color: var(--text-tertiary); font-size: 12px; text-align: center;
}

.landing-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 767px) { .landing-grid { grid-template-columns: 1fr; } }

.landing-chart-card, .landing-feed-card { background: var(--eq-bg-card); border: 1px solid var(--eq-border); border-radius: var(--eq-card-radius); padding: 18px 20px; }
.landing-panel-title { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-tertiary); margin-bottom: 4px; }
.landing-chart-headline { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; }
.landing-chart-svg { display: block; width: 100%; height: 90px; color: var(--eq-chart-1); }
.landing-chart-empty { font-size: 12px; color: var(--text-tertiary); font-style: italic; padding: 28px 0; text-align: center; }

.landing-feed-row { padding: 10px 0; border-top: 1px solid var(--eq-border); }
.landing-feed-row:first-of-type { border-top: 0; }
.landing-feed-text { font-size: 13px; color: var(--text-primary); font-weight: 600; }
.landing-feed-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
.landing-feed-empty { font-size: 12px; color: var(--text-tertiary); font-style: italic; padding: 12px 0; }

.landing-cta-row { display: flex; justify-content: center; margin-top: 26px; }
.landing-cta {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(180deg, var(--eq-text-primary) 0%, var(--eq-btn-primary-end) 100%);
  color: var(--eq-bg-primary); font-weight: 700; font-size: 14px;
  padding: 13px 26px; border-radius: 999px; text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition: filter 0.15s, transform 0.15s;
}
.landing-cta:hover { filter: brightness(1.05); transform: translateY(-1px); }
.landing-cta:focus-visible { outline: 2px solid rgba(var(--eq-text-primary-rgb), 0.55); outline-offset: 3px; }
</style>
</head>
<body>

<div class="eq-loading-screen" id="eqLoadingScreen">
  <div class="eq-loading-orb"><img src="images/apple-touch-icon.png" alt=""></div>
</div>

<div class="landing">
  <div class="landing-header">
    <div>
      <div class="landing-greeting" id="landingGreeting">Good evening</div>
      <div class="landing-greeting-sub">Welcome back to Project Equavia</div>
    </div>
    <div class="landing-status">
      <div class="landing-status-date" id="landingDate">—</div>
      <div id="landingTime">—</div>
    </div>
  </div>

  <div class="landing-hero-slot">
    Hero image slot — placement/sizing pending (open decision #4, 00-OVERVIEW.md)
  </div>

  <div class="landing-grid">
    <div class="landing-chart-card">
      <div class="landing-panel-title">This week</div>
      <div class="landing-chart-headline" id="landingChartHeadline">Task completion trend</div>
      <svg class="landing-chart-svg" viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true">
        <path id="landingChartPath" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d=""/>
      </svg>
      <div class="landing-chart-empty" id="landingChartEmpty" style="display:none;">No tasks logged this week yet.</div>
    </div>
    <div class="landing-feed-card">
      <div class="landing-panel-title" style="margin-bottom:10px;">Recent activity</div>
      <div id="landingFeedList"></div>
      <div class="landing-feed-empty" id="landingFeedEmpty" style="display:none;">Nothing logged yet.</div>
    </div>
  </div>

  <div class="landing-cta-row">
    <a href="dashboard.html" class="landing-cta">Open Equavia →</a>
  </div>
</div>

<script>
(function () {
  'use strict';
  function storeGet(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function dateToKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function getGoals(key) { const g = storeGet(key); return Array.isArray(g) ? g : []; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // ---- Greeting + status (top row) ----
  const now = new Date();
  const h = now.getHours();
  document.getElementById('landingGreeting').textContent = 'Good ' + (h < 12 ? 'morning' : (h < 18 ? 'afternoon' : 'evening'));
  document.getElementById('landingDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('landingTime').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  // ---- Chart panel: real 7-day task-completion trend, same goals:<date>
  // lists and same technique as dashboard.html's own greeting sparkline --
  // not a fabricated decorative squiggle. Kept lighter than the reference
  // (one line, no secondary axis) -- Equavia has far less data per screen
  // than a financial research tool, per CLAUDE.md's own guidance. ----
  (function renderChart() {
    const activeNow = h < 6 ? new Date(now.getTime() - 86400000) : now;
    const pcts = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(activeNow); d.setDate(d.getDate() - i);
      const list = getGoals('goals:' + dateToKey(d));
      const total = list.length, done = list.filter((g) => g.done).length;
      pcts.push(total ? Math.round((done / total) * 100) : 0);
    }
    const pathEl = document.getElementById('landingChartPath');
    if (pcts.every((p) => p === 0)) {
      document.getElementById('landingChartEmpty').style.display = '';
      pathEl.setAttribute('d', '');
      return;
    }
    const min = Math.min.apply(null, pcts), max = Math.max.apply(null, pcts);
    const pad = Math.max((max - min) * 0.2, 5);
    const yMin = Math.max(0, min - pad), yMax = Math.min(100, max + pad) || 100;
    const W = 300, H = 40, top = 4, bot = 36;
    const xFor = (i) => (i / (pcts.length - 1)) * W;
    const yFor = (v) => bot - ((v - yMin) / ((yMax - yMin) || 1)) * (bot - top);
    let d = '';
    pcts.forEach((p, i) => { d += (i === 0 ? 'M ' : ' L ') + xFor(i).toFixed(1) + ' ' + yFor(p).toFixed(1); });
    pathEl.setAttribute('d', d);
  })();

  // ---- Feed panel: real recent-activity, same cross-domain sources
  // Settings' Activity category reads (weight/sleep/habits/contacts/
  // tasks), capped short per CLAUDE.md's "don't cram" guidance. ----
  (function renderFeed() {
    function dateKeyToMs(dk) {
      const p = String(dk || '').split('-').map(Number);
      if (p.length !== 3 || p.some(isNaN)) return null;
      return new Date(p[0], p[1] - 1, p[2]).getTime();
    }
    function relativeWhen(ms) {
      const days = Math.floor((Date.now() - ms) / 86400000);
      if (days <= 0) return 'today';
      if (days === 1) return 'yesterday';
      return days + 'd ago';
    }
    const items = [];
    try {
      (storeGet('po_coach_weights') || []).forEach((e) => {
        const ms = dateKeyToMs(e && e.dateKey);
        if (ms != null && e.weight != null) items.push({ t: ms, text: 'Logged ' + e.weight + 'kg' });
      });
    } catch (e) {}
    try {
      (storeGet('sleep_log_v1') || []).forEach((e) => {
        const ms = dateKeyToMs(e && e.dateKey);
        if (ms != null && e.hours != null) items.push({ t: ms, text: 'Logged ' + e.hours + 'h sleep' });
      });
    } catch (e) {}
    try {
      (storeGet('habits_v1') || []).forEach((hb) => {
        Object.keys(hb.history || {}).forEach((dk) => {
          if (!hb.history[dk]) return;
          const ms = dateKeyToMs(dk);
          if (ms != null) items.push({ t: ms, text: 'Habit: ' + hb.name + ' ✓' });
        });
      });
    } catch (e) {}
    const sorted = items.filter((it) => it.t != null && !isNaN(it.t)).sort((a, b) => b.t - a.t).slice(0, 5);
    const listEl = document.getElementById('landingFeedList');
    const emptyEl = document.getElementById('landingFeedEmpty');
    if (!sorted.length) { emptyEl.style.display = ''; return; }
    listEl.innerHTML = sorted.map((it) =>
      '<div class="landing-feed-row"><div class="landing-feed-text">' + esc(it.text) + '</div>' +
      '<div class="landing-feed-sub">' + relativeWhen(it.t) + '</div></div>'
    ).join('');
  })();

  // ---- Loading state: brief branded transition, fades once the real
  // content above has rendered (all synchronous here, so this is a fixed
  // short delay rather than tied to a real fetch). ----
  function hideLoadingScreen() {
    const el = document.getElementById('eqLoadingScreen');
    if (!el) return;
    el.classList.add('is-hidden');
    setTimeout(() => el.remove(), 500);
  }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    hideLoadingScreen();
  } else {
    setTimeout(hideLoadingScreen, 380);
  }
})();
</script>

</body>
</html>
